<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GIF → Sprite Sheet Generator</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f8f9fa;min-height:100vh;padding:32px 24px;color:#111;}
h1{font-size:22px;font-weight:700;}
.sub{color:#888;font-size:13px;margin-top:6px;margin-bottom:28px;}
.card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;padding:24px;margin-bottom:20px;}
.lbl{font-size:11px;color:#aaa;font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.drop-zone{border:2px dashed #d0d5dd;border-radius:12px;padding:40px 24px;text-align:center;cursor:pointer;background:#fff;transition:all .15s;margin-bottom:20px;}
.drop-zone.drag{border-color:#4f8ef7;background:#eef4ff;}
.error{color:#e53e3e;font-size:13px;padding:10px 14px;background:#fff5f5;border-radius:8px;margin-bottom:16px;}
.mode-bar{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.mode-bar span{font-size:13px;font-weight:600;color:#555;white-space:nowrap;}
.mode-bar label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:#666;}
.mode-bar label.active{color:#111;font-weight:600;}
.mode-bar input[type=radio]{accent-color:#4f8ef7;width:15px;height:15px;}
.spacer{flex:1;}
.btn{padding:9px 22px;background:#111;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.btn:disabled{background:#ccc;cursor:not-allowed;}
.btn.blue{background:#4f8ef7;}
.btn.gray{background:#f0f0f0;color:#555;}
.btn.full{width:100%;padding:12px;font-size:14px;}
.info-box{background:#f0f4ff;border-radius:10px;padding:12px 16px;font-size:12px;color:#555;margin-bottom:20px;}
.info-box strong{color:#4f8ef7;}
.range-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.range-tag{background:#fff;border:1px solid #c7d7fd;border-radius:6px;padding:3px 10px;color:#3a5ccc;font-weight:500;font-size:12px;}
.stat-box{font-size:12px;color:#888;background:#f8f9fa;border-radius:8px;padding:10px 12px;margin-top:0;line-height:1.9;}
.warn{color:#e67e22;}
.result-meta{font-size:12px;color:#888;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
.result-meta strong{color:#111;}
.sheet-preview{overflow-x:auto;margin-bottom:16px;border-radius:8px;
  background:repeating-conic-gradient(#e5e7eb 0% 25%,#fff 0% 50%) 0 0/20px 20px;padding:8px;}
.sheet-preview img{max-width:100%;display:block;image-rendering:pixelated;}
.checker{background:repeating-conic-gradient(#e5e7eb 0% 25%,#fff 0% 50%) 0 0/16px 16px;border-radius:8px;padding:8px;display:inline-block;}
.preview-img{max-width:110px;max-height:110px;display:block;image-rendering:pixelated;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#fff;border-radius:16px;padding:32px;width:440px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h2{font-size:17px;font-weight:700;margin-bottom:6px;}
.modal p{font-size:13px;color:#888;margin-bottom:20px;}
.modal label{font-size:12px;color:#555;font-weight:600;display:block;margin-bottom:6px;}
.modal input[type=text]{width:100%;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px;outline:none;margin-bottom:14px;}
.modal input[type=text]:focus{border-color:#4f8ef7;}
.file-list{background:#f8f9fa;border-radius:8px;padding:10px 12px;margin-bottom:20px;font-size:12px;color:#666;}
.file-list .ftitle{font-weight:600;margin-bottom:6px;color:#444;}
.file-tags{display:flex;flex-wrap:wrap;gap:4px;}
.file-tag{background:#fff;border:1px solid #e0e0e0;border-radius:5px;padding:2px 8px;color:#333;}
.file-tag span{color:#aaa;}
.modal-btns{display:flex;gap:10px;}
.modal-btns .btn{flex:1;padding:11px;}
.progress{font-size:13px;color:#4f8ef7;margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div style="max-width:700px;margin:0 auto;">
  <h1>GIF → Sprite Sheet</h1>
  <p class="sub">원본 색상 완벽 보존 · 원본 배경 유지 · 16,384px 초과 시 2줄 자동 배치</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".gif" style="display:none"/>
    <div style="font-size:36px;margin-bottom:8px;">🎞️</div>
    <div id="dropText">
      <div style="font-weight:600;color:#333;">GIF 파일을 드래그하거나 클릭하여 업로드</div>
      <div style="color:#aaa;font-size:12px;margin-top:4px;">GIF 파일만 지원됩니다</div>
    </div>
  </div>

  <div class="error" id="errorBox" style="display:none;"></div>

  <div class="card">
    <div class="mode-bar">
      <span>추출 모드</span>
      <label id="lbl-normal" class="active"><input type="radio" name="mode" value="normal" checked/> 일반</label>
      <label id="lbl-144"><input type="radio" name="mode" value="144"/> 144프레임</label>
      <label id="lbl-296"><input type="radio" name="mode" value="296"/> 296프레임</label>
      <div class="spacer"></div>
      <button class="btn" id="extractBtn" disabled>추출하기</button>
    </div>
  </div>

  <div class="info-box" id="modeInfo" style="display:none;"></div>

  <div class="card" id="fileInfoCard" style="display:none;">
    <div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">
      <div>
        <div class="lbl">미리보기</div>
        <div class="checker"><img id="previewImg" class="preview-img"/></div>
      </div>
      <div style="flex:1;min-width:180px;">
        <div class="lbl">파일 정보</div>
        <div class="stat-box" id="statBox"></div>
      </div>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none;">
    <div class="lbl">결과</div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="sheet-preview"><img id="resultImg"/></div>
    <button class="btn blue full" id="downloadBtn">PNG 다운로드</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <h2>파일 저장</h2>
    <p id="modalDesc"></p>
    <label>파일명 (공통 접두사)</label>
    <input type="text" id="saveNameInput" placeholder="예: character_idle"/>
    <div class="file-list">
      <div class="ftitle">저장될 파일 목록:</div>
      <div class="file-tags" id="fileTagList"></div>
    </div>
    <div class="modal-btns">
      <button class="btn gray" id="cancelBtn">취소</button>
      <button class="btn blue" id="confirmBtn">저장하기</button>
    </div>
    <div class="progress" id="progressText" style="display:none;"></div>
  </div>
</div>

<script>
const SUFFIXES   = ["01","02","03","f","c","b","d","e"];
const RANGES_144 = [[1,10],[11,14],[15,24],[25,36],[37,66],[73,86],[91,108],[109,144]];
const RANGES_296 = [[1,10],[11,26],[27,60],[61,84],[85,152],[159,184],[189,244],[245,296]];
const MAX_W = 16384;

let gifW=0, gifH=0;
let composedFrames = []; // 각 프레임: Uint8Array (RGBA, gifW*gifH*4)
let currentFile = null;
let mode = "normal";
let resultCanvas = null;

// =====================================================================
// LZW 디코더
// =====================================================================
function lzwDecode(minCode, data) {
  const cc = 1 << minCode, eof = cc + 1;
  let codeSize = minCode + 1, mask = (1 << codeSize) - 1;
  const table = [];
  const init = () => {
    table.length = 0;
    for (let i = 0; i < cc; i++) table.push(new Uint8Array([i]));
    table.push(null); table.push(null);
  };
  init();
  const out = [];
  let buf = 0, bits = 0, dp = 0, prev = null;
  const read = () => {
    while (bits < codeSize && dp < data.length) { buf |= data[dp++] << bits; bits += 8; }
    const c = buf & mask; buf >>= codeSize; bits -= codeSize; return c;
  };
  while (true) {
    const code = read();
    if (code === eof) break;
    if (code === cc) { init(); codeSize = minCode + 1; mask = (1 << codeSize) - 1; prev = null; continue; }
    let entry;
    if (code < table.length && table[code]) entry = table[code];
    else if (prev && code === table.length) entry = new Uint8Array([...prev, prev[0]]);
    else break;
    for (const p of entry) out.push(p);
    if (prev) {
      const ne = new Uint8Array([...prev, entry[0]]);
      table.push(ne);
      if (table.length === (1 << codeSize) + 1 && codeSize < 12) { codeSize++; mask = (1 << codeSize) - 1; }
    }
    prev = entry;
  }
  return new Uint8Array(out);
}

// =====================================================================
// 인터레이스 해제
// =====================================================================
function deinterlace(src, w, h) {
  const out = new Uint8Array(src.length);
  const passes = [{s:0,st:8},{s:4,st:8},{s:2,st:4},{s:1,st:2}];
  let si = 0;
  for (const p of passes)
    for (let y = p.s; y < h; y += p.st)
      for (let x = 0; x < w; x++) {
        const di = (y * w + x) * 4;
        out[di]=src[si]; out[di+1]=src[si+1]; out[di+2]=src[si+2]; out[di+3]=src[si+3];
        si += 4;
      }
  return out;
}

// =====================================================================
// GIF 파서 + 프레임 합성
// 결과: composedFrames[] — 각각 gifW*gifH*4 크기의 Uint8Array (RGBA)
// canvas/drawImage 미사용, 순수 픽셀 버퍼 연산만 사용
// =====================================================================
function parseGIF(buffer) {
  const d = new Uint8Array(buffer);
  let p = 0;
  const rb = () => d[p++];
  const rw = () => { const v = d[p] | (d[p+1] << 8); p += 2; return v; };

  // — 헤더 —
  p = 6;
  const lw = rw(), lh = rw();
  const pk = rb();
  const gctFlag = (pk >> 7) & 1, gctSize = pk & 7;
  const bgIdx = rb(); rb(); // bg color index, pixel aspect

  let gct = null;
  if (gctFlag) {
    const n = 1 << (gctSize + 1);
    gct = d.slice(p, p + n * 3);
    p += n * 3;
  }

  gifW = lw; gifH = lh;

  // 배경 버퍼: GIF background color index로 채움
  // (투명 인덱스 지정 없으면 배경색, 있으면 투명)
  const makeBgBuf = (ct, bgI, tiIdx) => {
    const buf = new Uint8Array(lw * lh * 4);
    if (ct && bgI >= 0 && bgI !== tiIdx) {
      const r = ct[bgI*3], g = ct[bgI*3+1], b = ct[bgI*3+2];
      for (let i = 0; i < lw * lh; i++) {
        buf[i*4]=r; buf[i*4+1]=g; buf[i*4+2]=b; buf[i*4+3]=255;
      }
    }
    // tiIdx와 같으면 투명(모두 0) — 이미 초기값이 0
    return buf;
  };

  const result = [];
  let gce = { disposal: 0, ti: -1, delay: 100 };

  // 현재 누적 버퍼 (이전 프레임 상태 유지용)
  let curBuf = new Uint8Array(lw * lh * 4); // 완전 투명으로 시작
  let savedBuf = null; // disposal=3 복원용

  while (p < d.length) {
    const block = rb();
    if (block === 0x3B) break;

    if (block === 0x21) {
      const lbl = rb();
      if (lbl === 0xF9) {
        rb(); // block size = 4
        const pk2 = rb();
        gce.disposal = (pk2 >> 3) & 7;
        gce.delay = (rw() * 10) || 100;
        const ti = rb();
        gce.ti = (pk2 & 1) ? ti : -1;
        rb(); // terminator
      } else {
        let s; while ((s = rb()) !== 0) p += s;
      }
    } else if (block === 0x2C) {
      const fx = rw(), fy = rw(), fw = rw(), fh = rw();
      const ip = rb();
      const lctFlag = (ip >> 7) & 1, interlace = (ip >> 6) & 1, lctSize = ip & 7;
      let ct = gct;
      if (lctFlag) {
        const n = 1 << (lctSize + 1);
        ct = d.slice(p, p + n * 3);
        p += n * 3;
      }

      const minCode = rb();
      const chunks = []; let s;
      while ((s = rb()) !== 0) { chunks.push(d.slice(p, p + s)); p += s; }
      const comp = new Uint8Array(chunks.reduce((a, c) => a + c.length, 0));
      let off = 0; for (const c of chunks) { comp.set(c, off); off += c.length; }

      const pixels = lzwDecode(minCode, comp);

      // 팔레트 → RGBA 패치 (색상 테이블에서 직접 읽기)
      const patch = new Uint8Array(fw * fh * 4);
      for (let i = 0; i < pixels.length; i++) {
        const idx = pixels[i];
        if (idx === gce.ti) {
          // 투명 — alpha 0, 나머지 0
          patch[i*4]=0; patch[i*4+1]=0; patch[i*4+2]=0; patch[i*4+3]=0;
        } else if (ct) {
          patch[i*4]   = ct[idx*3];
          patch[i*4+1] = ct[idx*3+1];
          patch[i*4+2] = ct[idx*3+2];
          patch[i*4+3] = 255;
        }
      }

      const patchFinal = interlace ? deinterlace(patch, fw, fh) : patch;

      // disposal=3: 이 프레임 합성 전 상태 저장
      if (gce.disposal === 3) savedBuf = curBuf.slice();

      // 패치를 curBuf에 합성
      // 투명 픽셀(alpha=0)은 curBuf를 그대로 유지
      for (let row = 0; row < fh; row++) {
        for (let col = 0; col < fw; col++) {
          const si = (row * fw + col) * 4;
          const di = ((fy + row) * lw + (fx + col)) * 4;
          if (di < 0 || di + 3 >= curBuf.length) continue;
          if (patchFinal[si + 3] === 0) continue; // 투명 픽셀 스킵
          curBuf[di]   = patchFinal[si];
          curBuf[di+1] = patchFinal[si+1];
          curBuf[di+2] = patchFinal[si+2];
          curBuf[di+3] = patchFinal[si+3];
        }
      }

      // 현재 프레임 스냅샷 저장
      result.push(curBuf.slice());

      // disposal 처리
      if (gce.disposal === 2) {
        // 패치 영역을 배경색으로 복원
        // 배경색: gct와 bgIdx로 결정, ti와 같으면 투명
        const bgR = (gct && bgIdx !== gce.ti) ? gct[bgIdx*3]   : 0;
        const bgG = (gct && bgIdx !== gce.ti) ? gct[bgIdx*3+1] : 0;
        const bgB = (gct && bgIdx !== gce.ti) ? gct[bgIdx*3+2] : 0;
        const bgA = (gct && bgIdx !== gce.ti) ? 255 : 0;
        for (let row = 0; row < fh; row++) {
          for (let col = 0; col < fw; col++) {
            const di = ((fy + row) * lw + (fx + col)) * 4;
            if (di < 0 || di + 3 >= curBuf.length) continue;
            curBuf[di]=bgR; curBuf[di+1]=bgG; curBuf[di+2]=bgB; curBuf[di+3]=bgA;
          }
        }
      } else if (gce.disposal === 3 && savedBuf) {
        curBuf = savedBuf;
        savedBuf = null;
      }
      // disposal 0,1: curBuf 그대로 유지

      gce = { disposal: 0, ti: -1, delay: 100 };
    }
  }

  composedFrames = result;
}

// =====================================================================
// 스프라이트 시트 빌드
// composedFrames의 Uint8Array를 직접 ImageData로 써서 canvas에 putImageData
// =====================================================================
function buildSheet(frames) {
  const total = frames.length;
  if (!total) return null;
  const singleW = gifW * total;
  const rows = singleW > MAX_W ? 2 : 1;
  const cols = rows === 2 ? Math.ceil(total / 2) : total;

  const canvas = document.createElement("canvas");
  canvas.width  = gifW * cols;
  canvas.height = gifH * rows;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < total; i++) {
    const row = (rows === 2 && i >= cols) ? 1 : 0;
    const col = (rows === 2 && i >= cols) ? i - cols : i;
    // Uint8Array → Uint8ClampedArray → ImageData (복사 없이 뷰로)
    const clamped = new Uint8ClampedArray(frames[i].buffer, frames[i].byteOffset, frames[i].byteLength);
    const imgData = new ImageData(clamped, gifW, gifH);
    ctx.putImageData(imgData, col * gifW, row * gifH);
  }

  return {
    canvas, rows, cols,
    topCount: rows === 2 ? cols : total,
    botCount: rows === 2 ? total - cols : 0,
    total
  };
}

function buildRangeSheet(start, end) {
  const slice = composedFrames.slice(start - 1, end);
  if (!slice.length) return null;
  return buildSheet(slice).canvas;
}

// =====================================================================
// 다운로드
// =====================================================================
function downloadCanvas(canvas, filename) {
  return new Promise(res => {
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => { URL.revokeObjectURL(a.href); res(); }, 300);
    }, "image/png");
  });
}

// =====================================================================
// UI
// =====================================================================
function showError(msg) { const b = document.getElementById("errorBox"); b.textContent = msg; b.style.display = msg ? "block" : "none"; }
function setExtractEnabled(v) { document.getElementById("extractBtn").disabled = !v; }

function updateModeInfo() {
  const info = document.getElementById("modeInfo");
  const ranges = mode === "144" ? RANGES_144 : mode === "296" ? RANGES_296 : null;
  if (!ranges) { info.style.display = "none"; return; }
  const tags = ranges.map((r, i) => `<span class="range-tag">${SUFFIXES[i]} : ${r[0]}~${r[1]}</span>`).join("");
  info.innerHTML = `<strong>${mode}프레임 모드</strong> — 아래 구간별로 분할 저장됩니다<div class="range-tags">${tags}</div>`;
  info.style.display = "block";
}

function updateStats() {
  if (!composedFrames.length) return;
  const n = composedFrames.length;
  const totalW = gifW * n;
  const warn = totalW > MAX_W
    ? `<div class="warn">⚠️ 16,384px 초과 → 2줄 배치 (위 ${Math.ceil(n/2)} / 아래 ${Math.floor(n/2)}프레임)</div>` : "";
  document.getElementById("statBox").innerHTML = `
    <div>총 프레임: <strong>${n}</strong></div>
    <div>프레임 크기: <strong>${gifW}×${gifH}px</strong></div>
    ${mode === "normal" ? `<div>예상 너비: <strong style="color:${totalW>MAX_W?"#e67e22":"#111"}">${totalW.toLocaleString()}px</strong></div>${warn}` : ""}
  `;
}

function updateFileTagList(name) {
  const ranges = mode === "144" ? RANGES_144 : RANGES_296;
  document.getElementById("fileTagList").innerHTML = ranges.map((r, i) =>
    `<span class="file-tag">${name || "파일명"}${SUFFIXES[i]}.png <span>(${r[0]}~${r[1]})</span></span>`
  ).join("");
}

function loadFile(file) {
  if (!file || !file.name.toLowerCase().endsWith(".gif")) { showError("GIF 파일만 업로드할 수 있습니다."); return; }
  showError("");
  currentFile = file;
  composedFrames = []; resultCanvas = null;
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("dropText").innerHTML = `<div style="font-weight:600;color:#111;">${file.name}</div><div style="color:#888;font-size:12px;margin-top:4px;">파싱 중...</div>`;
  document.getElementById("previewImg").src = URL.createObjectURL(file);

  const reader = new FileReader();
  reader.onload = e => {
    try {
      parseGIF(e.target.result);
      if (!composedFrames.length) throw new Error("프레임을 찾을 수 없습니다.");
      document.getElementById("dropText").innerHTML = `<div style="font-weight:600;color:#111;">${file.name}</div><div style="color:#888;font-size:12px;margin-top:4px;">${composedFrames.length}프레임 · ${gifW}×${gifH}px</div>`;
      document.getElementById("fileInfoCard").style.display = "block";
      updateStats();
      setExtractEnabled(true);
    } catch(err) { showError("GIF 파싱 실패: " + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function handleExtract() {
  if (!composedFrames.length) return;
  showError("");
  if (mode === "normal") {
    document.getElementById("extractBtn").textContent = "처리 중...";
    setExtractEnabled(false);
    setTimeout(() => {
      try {
        const r = buildSheet(composedFrames);
        resultCanvas = r.canvas;
        document.getElementById("resultMeta").innerHTML = `
          <span>크기: <strong>${r.canvas.width}×${r.canvas.height}px</strong></span>
          <span>줄 수: <strong>${r.rows}줄</strong></span>
          ${r.rows === 2 ? `<span>위 ${r.topCount} / 아래 ${r.botCount}프레임</span>` : ""}
          <span>총 ${r.total}프레임</span>
        `;
        document.getElementById("resultImg").src = r.canvas.toDataURL("image/png");
        document.getElementById("resultCard").style.display = "block";
      } catch(err) { showError("생성 실패: " + err.message); }
      finally { document.getElementById("extractBtn").textContent = "추출하기"; setExtractEnabled(true); }
    }, 50);
  } else {
    const baseName = currentFile?.name.replace(/\.gif$/i, "") || "sprite";
    document.getElementById("saveNameInput").value = baseName;
    document.getElementById("modalDesc").textContent = `${mode}프레임 모드 — ${SUFFIXES.length}개 PNG가 순서대로 저장됩니다.`;
    updateFileTagList(baseName);
    document.getElementById("progressText").style.display = "none";
    document.getElementById("confirmBtn").disabled = false;
    document.getElementById("modalOverlay").style.display = "flex";
  }
}

async function handleSaveConfirm() {
  const name = document.getElementById("saveNameInput").value.trim();
  if (!name) return;
  const ranges = mode === "144" ? RANGES_144 : RANGES_296;
  document.getElementById("confirmBtn").disabled = true;
  document.getElementById("progressText").style.display = "block";
  try {
    for (let i = 0; i < ranges.length; i++) {
      document.getElementById("progressText").textContent = `저장 중... (${i+1}/${ranges.length}) ${name}${SUFFIXES[i]}.png`;
      const canvas = buildRangeSheet(ranges[i][0], ranges[i][1]);
      if (!canvas) continue;
      await downloadCanvas(canvas, `${name}${SUFFIXES[i]}.png`);
    }
    document.getElementById("progressText").textContent = "✅ 저장 완료!";
    setTimeout(() => document.getElementById("modalOverlay").style.display = "none", 1200);
  } catch(err) {
    showError("저장 실패: " + err.message);
    document.getElementById("modalOverlay").style.display = "none";
  } finally { document.getElementById("confirmBtn").disabled = false; }
}

// 이벤트
const dz = document.getElementById("dropZone");
dz.addEventListener("click", () => document.getElementById("fileInput").click());
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("drag"); });
dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("drag"); loadFile(e.dataTransfer.files[0]); });
document.getElementById("fileInput").addEventListener("change", e => loadFile(e.target.files[0]));

document.querySelectorAll("input[name=mode]").forEach(r => {
  r.addEventListener("change", () => {
    mode = r.value;
    document.querySelectorAll(".mode-bar label").forEach(l => l.classList.remove("active"));
    document.getElementById("lbl-" + mode).classList.add("active");
    updateModeInfo(); updateStats();
    document.getElementById("resultCard").style.display = "none";
  });
});

document.getElementById("extractBtn").addEventListener("click", handleExtract);
document.getElementById("downloadBtn").addEventListener("click", () => {
  if (!resultCanvas) return;
  downloadCanvas(resultCanvas, (currentFile?.name.replace(/\.gif$/i, "") || "sprite") + "sheet.png");
});
document.getElementById("cancelBtn").addEventListener("click", () => document.getElementById("modalOverlay").style.display = "none");
document.getElementById("saveNameInput").addEventListener("input", e => updateFileTagList(e.target.value.trim()));
document.getElementById("saveNameInput").addEventListener("keydown", e => { if (e.key === "Enter") handleSaveConfirm(); });
document.getElementById("confirmBtn").addEventListener("click", handleSaveConfirm);
</script>
</body>
</html>
